version: 1
contractHash: sha256:4c9f0e9d1529017ba37ce36a8c4d89d314aee4a211c25451b6303e2ae1bf3e36
name: sonar_tui_smoke
intent: |
    a user can launch the sonar TUI, see the initial screen, and quit with ctrl+c.
target:
    # Driven through the fake DeepSeek fixture. Pointing at the real
    # binary made this spec depend on an ambient DEEPSEEK_API_KEY: it
    # passed where one was exported and exited 1 in CI. See
    # specs/fixtures/fake_deepseek.
    cmd:
        - "${projectRoot}/.glyphrun/tmp/fake-deepseek"
        - "${projectRoot}/bin/sonar"
        - "${projectRoot}/.glyphrun/tmp/smoke-protocol.txt"
    cwd: "."
    env:
        HOME: "${projectRoot}/.glyphrun/tmp/home"
        SONAR_AGENTS_DIR: "${projectRoot}/.glyphrun/tmp/agents"
        OLLAMA_HOST: "http://127.0.0.1:1"
preconditions:
    commands:
        - run: "rm -rf .glyphrun/tmp/smoke-protocol.txt .glyphrun/tmp/home .glyphrun/tmp/agents && mkdir -p .glyphrun/tmp/home/.config/sonar .glyphrun/tmp/agents && printf '%s\\n' 'model:' '  auto_select: false' 'ice:' '  enabled: false' > .glyphrun/tmp/home/.config/sonar/config.yaml && go build -o ./bin/sonar ./cmd/sonar && go build -o .glyphrun/tmp/fake-deepseek ./specs/fixtures/fake_deepseek"
          cwd: "."
          timeoutMs: 30000
steps:
    - wait:
        screen:
            contains: "DEEPSEEK_API_KEY"
        timeoutMs: 8000
    - snapshot: launch
    - press: "ctrl+c"
    - wait:
        process:
            exited: true
        timeoutMs: 8000
outcomes:
    - id: launch_snapshot_stable
      description: the normal-width welcome and the missing-credential guidance remain stable
      verify:
        snapshot:
            name: launch
            mode: text
    - id: welcome_visible
      description: launch names the resolved provider and model
      verify:
        screen:
            contains: "deepseek"
    - id: ctrl_c_quits
      description: ctrl+c exits the TUI cleanly
      verify:
        process:
            exitCode: 0
