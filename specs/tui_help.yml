version: 1
contractHash: sha256:90815d24e4cb8ed5dc9f2c5504b50de8c152c3083f581af5bf61f3d0cb644b87
name: sonar_tui_help
intent: |
    a user can open the sonar TUI help overlay, see shortcut and slash-command guidance, close it, and quit.
target:
    # Driven through the fake DeepSeek fixture. Pointing at the real
    # binary made this spec depend on an ambient DEEPSEEK_API_KEY: it
    # passed where one was exported and exited 1 in CI, and even with a
    # placeholder it pinged api.deepseek.com for a 401. See
    # specs/fixtures/fake_deepseek.
    cmd:
        - "${projectRoot}/.glyphrun/tmp/fake-deepseek"
        - "${projectRoot}/bin/sonar"
        - "${projectRoot}/.glyphrun/tmp/help-protocol.txt"
    cwd: "."
    env:
        HOME: "${projectRoot}/.glyphrun/tmp/help-home"
        SONAR_AGENTS_DIR: "${projectRoot}/.glyphrun/tmp/help-agents"
        OLLAMA_HOST: "http://127.0.0.1:1"
preconditions:
    commands:
        - run: "rm -rf .glyphrun/tmp/help-protocol.txt .glyphrun/tmp/help-home .glyphrun/tmp/help-agents && mkdir -p .glyphrun/tmp/help-home/.config/sonar .glyphrun/tmp/help-agents && printf '%s\\n' 'model:' '  auto_select: false' 'ice:' '  enabled: false' > .glyphrun/tmp/help-home/.config/sonar/config.yaml && go build -o ./bin/sonar ./cmd/sonar && go build -o .glyphrun/tmp/fake-deepseek ./specs/fixtures/fake_deepseek"
          cwd: "."
          timeoutMs: 30000
steps:
    - wait:
        screen:
            contains: "enter send"
        timeoutMs: 5000
    - wait:
        screen:
            contains: "remote prompts"
        timeoutMs: 5000
    # Glyph v0.14.3 does not yet name F1; ESC OP is its terminal sequence.
    - send:
        bytes: "\\x1bOP"
    - wait:
        screen:
            contains: "Keyboard Shortcuts"
        timeoutMs: 3000
    - snapshot: help
    # Two pages: the help gained a Voice block (keyboard section + its own
    # rows) and one pgdown no longer reaches the slash-command list.
    - press: "pgdown"
    - press: "pgdown"
    - wait:
        screen:
            contains: "Slash Commands"
        timeoutMs: 3000
    - snapshot: help_commands
    - press: "q"
    - wait:
        screen:
            contains: "enter send"
        timeoutMs: 3000
    - press: "ctrl+c"
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: help_snapshot_stable
      description: the help overlay content matches the committed terminal snapshot
      verify:
        snapshot:
            name: help
            mode: text
    - id: slash_commands_snapshot_stable
      description: scrolling help reveals slash-command guidance
      verify:
        snapshot:
            name: help_commands
            mode: text
    - id: ctrl_c_quits
      description: ctrl+c exits the TUI cleanly after help is closed
      verify:
        process:
            exitCode: 0
