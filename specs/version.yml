version: 1
contractHash: sha256:be066bd383d905490f3ebbaf3293a6ed60effcd976e3b81efc262d321c826f94
name: sonar_version
intent: |
    a user can run sonar --version and the command exits successfully.
target:
    cmd: ["./bin/sonar", "--version"]
    cwd: "."
preconditions:
    commands:
        - run: "go build -o ./bin/sonar ./cmd/sonar"
          cwd: "."
          timeoutMs: 30000
steps:
    - wait:
        screen:
            contains: "dev"
        timeoutMs: 2000
    - wait:
        process:
            exitCode: 0
        timeoutMs: 2000
outcomes:
    - id: version_printed
      description: the version command prints the development version
      verify:
        screen:
            contains: "dev"
    - id: exits_zero
      description: the command exits successfully
      verify:
        process:
            exitCode: 0
