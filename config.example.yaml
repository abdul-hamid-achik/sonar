# sonar configuration
# Place at ./sonar.yaml, $XDG_CONFIG_HOME/sonar/config.yaml,
# or the fallback $HOME/.config/sonar/config.yaml (in precedence order).

# Inference. sonar runs hosted models; deepseek-v4-flash is the DEFAULT, not the
# only option. Endpoint, credential variable, default model, and context window
# all come from the embedded provider catalog, so naming a provider is enough:
#
#   provider: { type: groq }        # or cerebras, moonshot, fireworks, ...
#
# NOTE: only the OpenAI-compatible dialect exists today. That covers 27 of the
# catalog's 40 providers; anthropic, google, azure, bedrock, and vertex need
# their own dialects and will not work yet.
#
# The whole block below is optional — the defaults already resolve to:
#
#   type:        deepseek
#   base_url:    https://api.deepseek.com
#   model:       deepseek-v4-flash   (1M context, 384K max output)
#   api_key_env: DEEPSEEK_API_KEY
#
# Secrets are NEVER written here — only environment variable NAMES. The value is
# read from the process environment at launch:
#
#   export DEEPSEEK_API_KEY=...
#   # or, with a secret manager:
#   tvault set -p sonar DEEPSEEK_API_KEY
#   tvault run -p sonar --only DEEPSEEK_API_KEY -- sonar
#
# provider:
#   type: deepseek
#   # Point at a gateway or proxy that speaks the same dialect:
#   # base_url: https://my-gateway.example.com/deepseek
#
# Chain-of-thought is ON by default, matching the API. It is the dominant cost
# term on long turns; a request opts out per-call, not from config.
#
# Cost, per 1M tokens (regular rate): $0.14 input on a cache miss, $0.0028 on a
# cache hit, $0.28 output. A cache hit is ~50x cheaper than a miss, so a stable
# prompt prefix is the single biggest lever you have. DeepSeek has announced
# peak-hour pricing at 2x every billing item (09:00-12:00 and 14:00-18:00
# Beijing time), so treat any in-app cost figure as an estimate.

# Optional: read provider API keys from a KEY=VALUE file instead of exporting
# them by hand. Only names the catalog recognises as credential variables are
# applied, and never over something already exported — a shared secrets file
# commonly also defines PATH or EDITOR, and applying those would corrupt the
# process. Override with SONAR_ENV_FILE.
#
# credentials:
#   env_file: ~/.config/sonar/env

# `provider: {type: ollama}` means Ollama Cloud (https://ollama.com/v1) with
# OLLAMA_API_KEY — an ordinary hosted OpenAI-compatible provider, like groq or
# cerebras. sonar has no local runtime and does not talk to a daemon on this
# machine.
#
# The block below is NOT that. It configures a local Ollama daemon for the ICE
# embeddings backend only, which is off by default because no hosted provider
# sonar supports serves an embeddings endpoint. It has no effect on chat.
ollama:
  model: "qwen3.5:2b"
  base_url: "http://localhost:11434"
  num_ctx: 16384

# local_only bounds TOOL endpoints (MCP), not inference. sonar always reaches
# DeepSeek over the network, so leaving this true does not keep prompts on the
# machine — it only refuses remote MCP servers. Shell tools are bounded by the
# sandbox below rather than by this setting.
# Presentation only: no effect on authority, tool policy, or what leaves the
# machine. Every scheme is contrast-checked for light and dark terminals.
# Pick interactively with /theme; that choice is stored in
# ~/.config/sonar/runtime-preferences.json and outranks this key.
ui:
  theme: nord # nord | catppuccin | dracula | everforest | gruvbox | kanagawa | one | rose-pine | solarized | tokyo-night
  # How wide conversational text may wrap, in columns. Code fences, diffs,
  # tables and inspectors always use the full pane and ignore this.
  #
  # Omitted, prose follows the terminal: it uses the width you actually have,
  # and shares a right edge with everything else on screen. Set a number to
  # pin a fixed measure instead — some readers prefer a shorter line, and long
  # lines are genuinely harder to scan.
  # prose_width: 96

privacy:
  local_only: true

# OS-level confinement for shell subprocesses: Seatbelt on macOS, bubblewrap on
# Linux. It is a second layer under the scoped-shell catalog, never a
# replacement for it.
#
# The catalog reads a command line, so it can refuse `curl` before it runs and
# is structurally blind to what a program does once started — `go test ./...`
# and `npm test` execute workspace code, and a workspace script can open a
# socket or read a file no argv ever named. The sandbox cannot read intent, but
# it binds what a process actually touches. Neither one subsumes the other.
#
# What it enforces: reads of the host secret paths are denied, writes are denied
# outside the workspace and the toolchain caches, and network access is denied.
# What it does not: the workspace stays writable, so a confined `rm -rf .` still
# destroys uncommitted work. Approvals remain the only thing that stops that.
#
# Off by default because it changes which commands SUCCEED, not only which are
# allowed to start — with the network denied, a build that needs to download a
# module fails. Turn it on deliberately rather than discover it.
# Turning this on also WIDENS what AUTO runs unattended, and that is the point.
# Most of the scoped-shell catalog's refusals exist to prove containment from a
# command line alone — an uncatalogued binary, `node -e`, a search that walks a
# directory. Once the kernel proves containment for every command, those
# refusals have nothing left to prove and stop asking.
#
# What keeps asking is what confinement does not cover: the workspace stays
# writable, so `rm -rf .` still destroys uncommitted work, and `git push
# --force` still rewrites history no filesystem boundary reaches. Those are
# decisions a human owns either way.
sandbox:
  enabled: false
  # Confined commands reach the network. Leave false: sonar's own provider
  # calls are made by the sonar process, never by a confined child, so denying
  # this costs inference nothing.
  #
  # While it is false, commands that cannot succeed WITHOUT the network keep
  # asking rather than being widened — `npm install`, `pip install`,
  # `go mod download`, `curl`. Running them unattended into a denial the same
  # setting causes would trade a useful question for a guaranteed failure the
  # person who could have answered it never sees. Set it true and they widen
  # with everything else.
  allow_network: false

# Read the transcript aloud. macOS only for now (`say`); a host without a
# synthesizer says so at startup instead of staying quiet and looking broken.
#
# What you hear is a PROJECTION, not the transcript. A path read aloud is noise:
# the same sentence measures 12.9 seconds spoken raw and 6.1 projected, and the
# whole difference is a URL and a file path being spelled out one character at a
# time. So paths collapse to their filename, links become "a link", code fences
# are never spoken at all, and the screen keeps the complete record.
#
# Four channels, because they are four different things to hear. An AUTO turn
# produces eight tool receipts and several reasoning blocks; spoken together
# they bury the one sentence worth waiting for.
#
# Typing cancels speech immediately and drops what was queued — someone typing
# has stopped listening. Scrolling does not: moving around the transcript is
# not taking over, and re-reading the paragraph above should not kill the
# sentence you scrolled up to follow.
#
# Run /voice status to see what is on, /voice voices to see which voice each
# language would use, and /voice test to hear them before choosing.
voice:
  enabled: false
  # The assistant's reply, spoken sentence by sentence as it streams.
  answer: true
  # The few moments that need a person: a tool waiting for approval, a turn
  # that finished after running long enough for you to have walked away, a turn
  # that failed. On by default, and the channel worth defending — reading an
  # answer aloud competes with reading it off the screen and loses, but an
  # approval nobody is looking at blocks the run until somebody glances over,
  # and nothing else in the harness can tell them.
  #
  # It says WHAT is waiting, never the command. A command read aloud is the
  # noise the projection exists to remove, and worse here, because the sentence
  # has to survive being heard from another room.
  alerts: true
  # Additionally say, once per crossing, that the context window passed three
  # quarters full. Off by default: the meter already shows it on screen and
  # compaction handles it unattended. It exists for the walkaway case, where
  # a filling window is inaudible and compaction will trim what was said.
  # context_alert: true
  # Thinking blocks, spoken once settled rather than streamed. Off by default:
  # reasoning contradicts itself, abandons paths, and runs far longer than the
  # answer, so streaming it alongside produces two voices arguing.
  reasoning: false
  # What the harness is doing — "reading", "running tests" — never the path it
  # is doing it to, and never repeated for a run of the same thing.
  activity: false
  # When the answer, reasoning and activity channels are allowed to speak:
  # "always", or "unfocused" to hold them back while this terminal window has
  # focus. Alerts ignore this — they exist for the person who is not there.
  #
  # "unfocused" is the setting that makes a voice in a coding tool worth
  # having. While you are reading the transcript, a synthesizer reading the
  # same words to you is slower than your eyes and in the way; the moment you
  # switch to another window it is the only channel you have left. Coming back
  # stops it, because you are about to read it faster.
  #
  # Not every terminal reports focus, and tmux has to be told to
  # (`set -g focus-events on`). A terminal that has never reported is treated
  # as "cannot tell" and speech goes ahead, because a setting whose unsupported
  # case is silence looks exactly like the feature being broken.
  # /voice status says whether this terminal has reported.
  # speak_when: always
  # Which synthesizer: "say" (default, local, free, offline) or "openai"
  # (hosted, needs OPENAI_API_KEY, costs per turn).
  #
  # The hosted one exists because of a measurement, not a preference. The same
  # sentence was read through four engines and transcribed back with the local
  # Whisper to see which words survived. `say` with a Spanish voice returned
  # "el merch ... el caché ... confit"; OpenAI's gpt-4o-mini-tts returned every
  # technical term intact with the Spanish around them intact too. A bilingual
  # answer is Spanish grammar around English nouns, and a monolingual voice
  # turns those nouns into different words.
  #
  # The same measurement found the rule that matters more: every engine TOLD
  # the language applied that language's letter-to-sound rules to the English
  # words — xAI given es-MX failed exactly the way `say` does — and every engine
  # left to DETECT it handled the mixture. So under "openai" no language is
  # sent and the respelling table below is not applied. Passing them made it
  # worse.
  #
  # Off by default: a second vendor, a second key, and about two seconds
  # between a sentence and its audio against `say`, which starts immediately.
  # The spoken close makes that one round trip per turn instead of twenty,
  # which is what makes it tolerable — not free. Playback needs ffplay, which
  # ships with the ffmpeg dictation already requires.
  # provider: openai
  #
  # The hosted synthesis model, when provider is "openai". Empty uses
  # gpt-4o-mini-tts — the one the measurements above were made against.
  # model: gpt-4o-mini-tts
  #
  # Advanced: an OpenAI-compatible speech endpoint to send the same request
  # shape to. Empty uses OpenAI's own. The credential sent never changes.
  # endpoint: https://api.openai.com/v1/audio/speech
  #
  # `say -v ?` lists this machine's voices, and /voice test speaks one so you
  # can hear it before committing. Empty uses the system default, and this
  # setting applies to every language.
  # voice: Samantha
  #
  # Worth knowing before tuning any of this: macOS ships the COMPACT version of
  # every voice, and the compact ones are the robotic ones. Downloading the
  # better variant (System Settings → Accessibility → Spoken Content → System
  # Voice → Manage Voices) changes how this feature sounds more than any
  # setting in this file. sonar prefers a downloaded variant automatically once
  # one exists, and /voice status tells you when none do.
  #
  # A voice per language, which is usually what you want instead. A voice is
  # built for one language and mangles the others — an English voice reading
  # "encontré el problema" lands somewhere between an accent and a different
  # sentence — so the harness detects which language an answer is in and picks
  # from here.
  #
  # A language with no entry gets one chosen from what the host has installed,
  # preferring your own region: that guess is what this map exists to correct.
  # The host's own language is deliberately left to the system default rather
  # than guessed at, because you already chose that one in system settings.
  # voices:
  #   es: Paulina    # Mexican Spanish; Mónica is Castilian
  #   en: Samantha
  #
  # Words per minute. Empty uses 210, faster than the system default, because a
  # coding session is listened to while working rather than attentively.
  # rate: 210
  #
  # Respell words for one language's voice. A voice carries one language's
  # letter-to-sound rules and applies them to everything it is given, which
  # turns the vocabulary of a coding session into DIFFERENT WORDS rather than
  # into an accent. Spanish reads "g" before e as /x/, so "merge" comes out
  # "MER-je", "package" comes out "pa-KA-je" and "storage" comes out
  # "sto-RA-je"; "h" is silent, so "hash" is "as"; "git" is "jit".
  #
  # sonar ships a table for Spanish. This overrides any entry in it, and an
  # empty value removes one.
  #
  # It is here because this is the one part of spoken output that could not be
  # verified the way the rest was. Audio length is measurable and settled every
  # other question — which acronyms are misread, how much an emoji costs — but
  # whether "diplói" SOUNDS closer to "deploy" than "deploy" does is a
  # judgement only the listener can make. Run /voice test: the Spanish line is
  # deliberately loaded with these words. Anything that sounds worse than what
  # it replaced belongs here.
  # pronounce:
  #   es:
  #     deploy: diplói
  #     cache: ""       # empty removes the shipped respelling

  # Dictation: ctrl+g opens the microphone, ctrl+g again closes it and the
  # transcription lands in the composer. esc discards it. /voice does the same
  # thing from the composer.
  #
  # It used to be alt+v, and alt+v never arrived. On a stock macOS terminal
  # Option is not Meta: Option+V composes "√" and types it into the draft, so
  # the binding was invisible and looked exactly like dictation being broken.
  # alt+v still works where the terminal was told otherwise ("Use Option as
  # Meta key", or Ghostty's macos-option-as-alt = true) — and where it was not,
  # typing that "√" into an empty composer now explains itself.
  #
  # While the microphone is open the rail draws the input level. That meter is
  # driven by what the recorder actually hears, so a flat one means a muted
  # input or the wrong device rather than a frozen animation, and after a few
  # seconds of nothing it says so in words.
  #
  # What arrives is a draft you read before sending: dictation mis-hears, and
  # nobody should act on words no one said.
  #
  # Toggle rather than hold-to-talk because terminals report key RELEASE only
  # under the Kitty protocol; a hold binding would work in Ghostty and do
  # nothing in Terminal.app.
  #
  # Local only, and deliberately: a hosted transcriber is faster and nearly
  # free, but audio carries who is in the room and what else was said, which is
  # a different decision from sending text. Needs two tools, and pressing ctrl+g
  # without them names which one is missing:
  #
  #   brew install ffmpeg whisper-cpp
  #
  # That is NOT enough on its own. Homebrew's whisper-cpp ships one 575 KB test
  # fixture and no usable model, so both commands succeed and dictation still
  # cannot run. Download one:
  #
  #   mkdir -p ~/.cache/whisper.cpp && curl -L -o ~/.cache/whisper.cpp/ggml-base.bin \
  #     https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
  #
  # `/voice status` reports every part of the pipeline and the command that
  # fixes whichever one is missing.
  #
  # There is no enable flag — the key does nothing until pressed.
  input:
    # A whisper.cpp ggml model path. Empty searches the usual install locations
    # and prefers the smaller models: on a laptop the difference between base
    # and large is seconds of waiting per utterance.
    # model: ~/.cache/whisper.cpp/ggml-base.bin
    # ISO code. Empty lets Whisper detect it, which costs a little latency and
    # is the right default if you switch languages.
    # language: es

# Provider-loop budgets are independent so interactive turns stay concise while
# AUTO has room to inspect, implement, and verify without a premature stop.
tools:
  timeout: 30s
  # Bounds a single MCP tool call. The 60s default suits interactive tools, but
  # a server that indexes a codebase first — vecgrep embeds through local
  # Ollama, codemap builds a symbol graph — legitimately runs for minutes on a
  # large repo.
  #
  # This matters more than it looks. A timeout is indistinguishable from a hung
  # server, so the call is "unanswered"; an unanswered call whose effect class
  # is unknown becomes an outcome_unknown, which halts the turn and demands a
  # manual /recover. Two settings prevent that together:
  #   1. this headroom, and
  #   2. an exact read_only trust route for the tool (see servers[].trust
  #      below), which both auto-authorizes it and makes a timeout a plain
  #      failure the loop can continue past.
  #
  # For vecgrep specifically the real cure is operational: run its background
  # daemon (`vecgrep daemon start`), which owns the index, watches files, and
  # throttles Ollama, so calls answer from a warm index instead of building one
  # inside the call.
  # mcp_timeout: 5m
  max_grep_results: 500
  max_iterations: 10
  # auto_max_iterations bounds ONE provider segment. When it fires, AUTO
  # checkpoints and starts another segment, so the work an AUTO turn can reach
  # is iterations x segments — bounded by the two ceilings below.
  auto_max_iterations: 40
  # Whole-turn AUTO ceilings. These are what make an unattended job of several
  # hours possible; raising auto_max_iterations alone cannot, because the
  # whole-turn ceiling applies on top of it.
  #
  # Defaults are 8 segments and 90m, so leaving these unset behaves exactly as
  # before. Raise them for long unattended work, and remember that a metered
  # hosted provider bills for every one of those segments.
  #
  # Neither weakens the stall guard: a segment that repeats the previous work
  # set with no verified effects still ends the run, whatever the ceiling.
  # auto_max_segments: 40
  # auto_max_wall_time: 6h
  #
  # How long a tool call waits for a human approval before the host refuses it
  # and the run continues with the next call. Omitted means wait indefinitely,
  # which is right when someone is watching.
  #
  # Set it for unattended runs. Otherwise the first approval consumes the whole
  # remaining wall budget in front of a modal nobody will answer, and the run
  # ends having done nothing. A timeout can only withhold permission, never
  # grant it: the call does not run, the refusal is recorded, and the model is
  # told to find another route.
  # approval_timeout: 2m

# Typed continuation actions are suggestions by default. auto_read_only may
# follow only exact, fully specified, unblocked, registry-validated read-only
# contracts; it never auto-runs shell, mutation, secreted execution, or a
# generic gateway proxy. Every call still passes normal host trust, approval,
# and execution-ledger checks. The runtime hard ceiling is two automatic steps.
continuations:
  mode: suggest # off | suggest | auto_read_only
  max_auto_steps: 2

# Auto-routing uses installed, non-exclusive compact tiers only. Qwen 9B,
# Ornith 9B, and Gemma E2B remain available for an explicit deep-task profile.
model:
  models:
    - name: "qwen3.5:0.8b"   # trivial: routing/classification only — weak at tools
      family: "qwen3.5"
      size: "0.8B"
      capability: "simple"
    - name: "qwen3.5:2b"     # DEFAULT: smallest model with usable tool calling
      family: "qwen3.5"
      size: "2B"
      capability: "medium"
      default: true
    - name: "qwen3.5:4b"     # largest memory-safe tier; reliable multi-step tools
      family: "qwen3.5"
      size: "4B"
      capability: "complex"
    - name: "phi4-mini:latest"
      family: "phi"
      size: "2.5GB"
      capability: "medium"
      exclusive: true            # manual-only until behavioral tool verification
    - name: "qwen3.5:9b"
      family: "qwen3.5"
      size: "6.6GB"
      capability: "advanced"
      exclusive: true
    - name: "ornith:latest"  # Qwen 3.5-derived 9B coding model; observed Q4 weights
      family: "qwen3.5"
      size: "5.6GB Q4"
      parameters: "9 billion"
      context_size: 262144   # model max; runtime allocation remains ollama.num_ctx
      capability: "advanced"
      exclusive: true
    - name: "gemma4:e2b"
      family: "gemma"
      size: "7.2GB"
      capability: "medium"
      exclusive: true
  default_model: "qwen3.5:2b"
  fallback_chain: ["qwen3.5:2b", "qwen3.5:0.8b", "qwen3.5:4b"]
  auto_select: true
  embed_model: "nomic-embed-text"

# Read-only application-level expert consultation. Team, Swarm, and MoE use
# ordinary tool-free Ollama calls; they are not a model-internal/token-level MoE.
# Zero concurrency and fan-out values mean auto. Explicit values are caps only:
# they can reduce work but never force the machine above the measured CPU/RAM
# plan. The runtime serializes work when the accepted model set fits, or reduces
# deterministic fan-out when the complete local weight set does not fit.
experts:
  enabled: true
  max_concurrent_inference: 0
  max_concurrent_distinct_models: 0
  max_team_experts: 0
  max_swarm_workers: 0
  max_moe_experts: 0
  max_eval_tokens: 768
  timeout: 90s

# ICE (Infinite Context Engine) is DISABLED by default in sonar — see below.
# Embeddings are computed locally via Ollama (nomic-embed-text); no data leaves
# the machine. An empty store_path uses the managed
# ~/.config/sonar/conversations.json default. A non-empty relative value
# is rooted under ~/.config/sonar/ice/<workspace-hash>; absolute paths
# and `..` escapes are rejected so repository config cannot write elsewhere or
# place private embeddings inside the Git worktree.
ice:
  # OFF by default in sonar. ICE needs an embeddings endpoint and DeepSeek's API
  # does not expose one, so enabling it requires a separate local embedding
  # backend (Ollama with embed_model below) — which reintroduces a non-API
  # dependency the harness otherwise does not have.
  # enabled: false
  embed_model: "nomic-embed-text"
  # store_path: "conversations.json"

# MCP tool servers. Prefer placing executable STDIO entries in user-wide
# configuration. A repository-local copy of this file must be trusted with the
# exact SONAR_TRUST_REPO_MCP digest printed at startup before any STDIO
# process is spawned; changing the resolved executable or its content, command,
# args, env, exact trust routes, or repository path changes that digest.
servers:
  # Recommended: one lazy MCPHub gateway. It keeps specialist schemas out of
  # small-model context until needed and lets Cortex orchestrate the stack.
  - name: mcphub
    command: mcphub
    args: [mcp, serve, --agent, sonar]
    # Host-owned exact authority. This is honored only for local STDIO when
    # local_owner exactly matches the executable basename; wrappers, remote
    # transports, MCP annotations, wildcards, and suffix matches cannot widen it.
    # read_only routes are auto-authorized and ledgered as reads.
    # workspace_effectful routes are auto-authorized only in AUTO and only when
    # an explicit `workspace` argument resolves inside the active workspace.
    trust:
      local_owner: mcphub
      gateway: mcphub
      read_only:
        - bob__bob_check
        - bob__bob_context
        - bob__bob_inspect
        - bob__bob_path
        - bob__bob_plan
        - bob__bob_playbook
        - bob__bob_recipe_describe
        - bob__bob_stats
        - bob__bob_validate_manifest
        - cortex__cortex_handoff
        - cortex__cortex_list_tasks
        - cortex__cortex_metrics
        - cortex__cortex_overview
        - cortex__cortex_read_artifact
        - cortex__cortex_read_evidence
        - cortex__cortex_recall_cases
        - cortex__cortex_sessions
        - cortex__cortex_status
        - cortex__cortex_timeline
        - mcphub_describe_tool
        - mcphub_get_result
        - mcphub_list_servers
        - mcphub_resolve_tool
        - mcphub_search_tools
        - mcphub_stats
      workspace_effectful:
        - cortex__cortex_begin_change
        - cortex__cortex_investigate
        - cortex__cortex_note
        - cortex__cortex_open_task
        - cortex__cortex_plan
        - cortex__cortex_remember
        - cortex__cortex_request_decision
        - cortex__cortex_resolve
        - cortex__cortex_start_task
        - cortex__cortex_verify

    # Recommended MCPHub agent (mcphub.yaml) for this harness:
    #   agents.sonar.mode: gateway
    #   pin: []
    #   tool_schema_budget: "0"
    #   servers: bob, cortex, codemap, vecgrep, hitspec, hitspec_web,
    #            fcheap, monitor, obsidian, minerva, glyph, cairntrace
    # Enrich each server's use_when / tags so mcphub_resolve_tool ranks well.
    # sonar host enrichment: resolve → optional host describe pre-fetch →
    # phase playbook → model mcphub_call_tool under normal approval.

    # Omitting trust currently uses a build-owned compatibility profile only
    # for exact mcphub/cortex/bob basenames. Prefer an explicit list. To suppress
    # that migration bridge, configure only: trust: {disabled: true}

  # Direct STDIO transport is also supported when MCPHub is not installed.
  # - name: noted
  #   command: noted
  #   args: [mcp]

  # tinyvault — requires `tvault init` before first use
  # - name: tinyvault
  #   command: tvault
  #   args: [mcp-server]

  # Docker MCP Gateway (requires Docker Desktop with MCP enabled)
  # - name: docker-gateway
  #   command: docker
  #   args: ["mcp", "gateway", "run"]

  # SSE transport
  # - name: remote-server
  #   transport: sse
  #   url: "http://localhost:8811"

  # Streamable HTTP transport
  # - name: streamable-server
  #   transport: streamable-http
  #   url: "http://localhost:8812/mcp"
